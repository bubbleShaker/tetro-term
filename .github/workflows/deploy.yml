name: Deploy to GitHub Pages

# main への push で自動的に再デプロイする。
# スマートフォンからの動作確認はこの経路に頼っているため（PLAN.md 参照）、
# ビルドは軽く保つこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 進行中のデプロイは打ち切らない。打ち切ると「push すれば必ず反映される」という
# スマホ確認の前提が崩れ、連続 push で古い版が残りうる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 権限はジョブ単位で最小限に。ビルドはリポジトリを読むだけでよい。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod に書かれたバージョンを使う。wasm_exec.js は
          # このバージョンの GOROOT からコピーされるので、両者は必ず一致する。
          go-version-file: go.mod

      # コアは環境を知らないので（→ docs/adr/0001）、ホストでそのまま検査できる。
      #
      # cmd/tetro-wasm もこの対象に入る。main.go は js/wasm 専用でホストからは
      # 見えないが、ブラウザに触らない判断（clock.go / screen.go）はビルドタグの
      # 無いファイルに分けてあり、そちらはホストでテストできる。
      # **go build ./... はここで使えない**——ホストでは func main が見えず落ちる。
      - name: テスト
        run: go test ./...

      # ブラウザ版のエントリは js/wasm でしかビルドされない。上の検査では触れられて
      # いないので、対象を切り替えてもう一度かける。
      - name: 静的検査 (js/wasm)
        run: GOOS=js GOARCH=wasm go vet ./...

      - name: ブラウザ版をビルド
        run: ./scripts/build-wasm.sh

      # Pages の有効化（Source: GitHub Actions）はリポジトリ設定側で済ませてある。
      # enablement: true はここでは使えない。Pages サイトの作成には pages: write が
      # 要るが、このジョブは最小権限で contents: read しか持たないため。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
