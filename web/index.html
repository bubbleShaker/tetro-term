<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no: 落ち物パズルの操作中に二本指ズームが暴発するのを防ぐ -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>tetro-term</title>
    <meta
      name="description"
      content="ターミナルで動く落ち物パズル。Go で書かれた同じコアが CLI とブラウザの両方で動く。"
    />
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --fg: #c8d0e0;
        --dim: #5c6773;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: max(0.75rem, env(safe-area-inset-top)) 0.75rem
          max(0.75rem, env(safe-area-inset-bottom));
        overflow: hidden;
        /* ダブルタップによる拡大を止める。viewport の user-scalable=no は
           iOS Safari が無視するので、こちらが本命の防ぎ手になる。
           none ではなく manipulation にしてあるのは、二本指の拡大まで殺すと
           見えづらいときの逃げ道が無くなるためである。 */
        touch-action: manipulation;
      }

      /* #stage は「端末を置ける広さ」を表すだけの入れ物。
         端末は桁数・行数が固定なので伸び縮みできず、代わりに JS が
         transform: scale() でこの広さに合わせて拡縮する（web/main.js）。
         はみ出しを隠すのは、拡縮が間に合わない一瞬のためのもの。 */
      #stage {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #terminal {
        /* 縮められるとフォントの実寸が測れなくなり、拡縮の計算が狂う。
           大きさはあくまで xterm が決め、flex には触らせない。 */
        flex: 0 0 auto;
        /* 端末らしい枠。ゲーム画面が主役なので装飾は最小限に留める */
        border: 1px solid #1c2230;
        border-radius: 6px;
        padding: 0.5rem;
        background: #0d1017;
      }

      #status {
        font-size: 0.75rem;
        color: var(--dim);
        min-height: 1.2em;
        text-align: center;
      }
      #status a {
        color: inherit;
      }
      /* WASM の起動が終わったら読み込み表示を畳む */
      body.ready #status {
        opacity: 0.6;
      }
      #status.error {
        color: #e05252;
      }

      /* タッチ操作のボタン列。中身は web/main.js が Go から受け取って作る。
         ここが空なのは、ボタンが何個あってどちらの親指に置かれるかを
         知っているのが Go の internal/input だけだからである。

         position: fixed ではなく body の縦フローに置いてある。出た分だけ
         #stage が縮み、#stage を見ている ResizeObserver が端末の倍率を
         測り直す——重なりを避ける計算をこちらで持つ必要がない。 */
      #pad {
        display: none;
        width: 100%;
        justify-content: space-between;
        gap: 0.75rem;
      }
      body.touch #pad {
        display: flex;
      }
      .pad-side {
        display: flex;
        gap: 0.5rem;
      }
      .pad-button {
        /* 指で狙える大きさを最優先する（44px を下回らない）。
           画面が狭ければ縮むが、縮みすぎない。 */
        width: clamp(2.75rem, 17vw, 4rem);
        aspect-ratio: 1;
        font-size: clamp(1.1rem, 6vw, 1.6rem);
        line-height: 1;
        color: var(--fg);
        background: #151a24;
        border: 1px solid #2a3446;
        border-radius: 12px;
        /* 押した場所と操作を 1 対 1 にする。none がスクロールと拡大を止め、
           残り 3 つが長押しの選択・メニュー・タップ時の灰色の被せを止める。
           これが無いと、素早く連打したときに操作ではなく文字選択が始まる。 */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* :active ではなく自前のクラスで光らせる。pointerdown を preventDefault
         しているので、:active が付くかはブラウザ任せになってしまう。 */
      .pad-button.pressed {
        background: #26314a;
        border-color: #3d4d6b;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="terminal"></div></div>
    <p id="status">Go の WebAssembly を読み込んでいます…</p>
    <div id="pad"></div>

    <!-- wasm_exec.js は Go の GOROOT からビルド時にコピーされる（scripts/build-wasm.sh） -->
    <script src="./wasm_exec.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
